# ============================================================
# EduHub 后端配置 - 阶段1: 单体应用
# ============================================================
server:
  port: 8080

spring:
  application:
    name: eduhub

  # ---------- 数据源 ----------
  datasource:
    url: jdbc:mysql://localhost:3306/eduhub?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP 连接池配置（面试考点：数据库连接池优化）
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000

  # ---------- Redis ----------
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  # ---------- Jackson 日期格式 ----------
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # ---------- 文件上传 ----------
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# ---------- MyBatis-Plus ----------
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.eduhub.entity
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    # 开发环境打印SQL（面试考点：SQL性能分析）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ---------- JWT ----------
eduhub:
  jwt:
    secret: EduHub2024SecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong!
    expiration: 86400000  # 24小时(毫秒)

  # ---------- 本地文件存储 ----------
  upload:
    path: ./uploads
    max-size: 10485760  # 10MB

# ---------- Knife4j / Swagger ----------
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.eduhub.controller

knife4j:
  enable: true
  setting:
    language: zh-CN
    enable-swagger-models: true
    enable-document-manage: true
    swagger-model-name: EduHub API

# ---------- 日志配置 ----------
logging:
  level:
    com.eduhub: DEBUG
    org.springframework: INFO
  file:
    path: ./logs
    name: ./logs/eduhub.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 7
